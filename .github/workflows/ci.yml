name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_long:
        description: 'Run the release fuzz budget instead of the nightly smoke budget'
        required: false
        type: boolean
        default: false
      fuzz_seconds:
        description: 'Fuzz duration in seconds for a manually requested long run'
        required: false
        type: string
        default: '86400'

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain: [stable, '1.75.0']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --all-features
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: RUSTDOCFLAGS=-Dwarnings cargo doc --no-deps --all-features

  differential:
    name: differential / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --quiet --all-features --bin pysyn
      - run: python tools/test_differential_ast.py
      - name: Locate CPython standard library corpus
        run: echo "PYTHON_STDLIB=$(python -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')" >> "$GITHUB_ENV"
      - name: Run token, AST, and round-trip comparisons with f-strings
        run: |
          python tools/differential.py \
            --python python \
            --pysyn target/debug/pysyn \
            --mode all \
            --include-fstrings \
            --strict-ast \
            --exclude '*/test/*' \
            --exclude '*/lib2to3/tests/*' \
            --report differential-${{ matrix.python-version }}.json \
          "$PYTHON_STDLIB"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: differential-${{ matrix.python-version }}
          path: differential-${{ matrix.python-version }}.json
          if-no-files-found: ignore

  syntax:
    name: CPython syntax diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo build --quiet --all-features --bin pysyn
      - name: Locate CPython syntax corpus
        run: echo "PYTHON_STDLIB=$(python -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')" >> "$GITHUB_ENV"
      - name: Check syntax detection and locations
        run: |
          python tools/syntax_validation.py \
            --python python \
            --pysyn target/debug/pysyn \
            --test-syntax "$PYTHON_STDLIB/test/test_syntax.py" \
            --min-detection 1.0 \
            --min-position 0.95 \
            --report syntax-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: syntax-validation
          path: syntax-validation.json
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Collect coverage report and enforce regression floor
        run: |
          PYSYN_COVERAGE_STDLIB="$(python -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')" \
          cargo llvm-cov --all-features --workspace \
          --fail-under-lines 85 \
          --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: lcov.info

  bench:
    name: Criterion benchmarks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            criterion-${{ runner.os }}-
      - run: cargo bench --bench parser -- --noplot
      - name: Enforce benchmark regression budget
        run: >-
          python tools/benchmark_gate.py
          --criterion target/criterion
          --max-regression 0.10
          --allow-missing-baseline

  fuzz:
    name: Rust fuzz and Python smoke
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.fuzz_long)
    runs-on: ubuntu-latest
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.fuzz_seconds || '600' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src
      - run: cargo install cargo-fuzz --locked
      - name: Run arbitrary-byte cargo-fuzz target
        run: cargo fuzz run parse_bytes -- -max_total_time="${FUZZ_SECONDS}"
      - name: Run structured-input cargo-fuzz target
        run: cargo fuzz run parse_structured -- -max_total_time="${FUZZ_SECONDS}"
      - run: cargo build --quiet --release --bin pysyn
      - name: Run deterministic Python parser fuzz smoke test
        run: >-
          python tools/fuzz_smoke.py
          --pysyn target/release/pysyn
          --cases 2000
          --seed 313
          --timeout 1
